<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-labelledby="title">
  <title id="title">Turning halo effect</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fff8ea" stop-opacity="0.32"/>
      <stop offset="48%" stop-color="#d9b85f" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#d9b85f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="800" cy="800" r="750" fill="url(#halo)"/>
  <circle cx="800" cy="800" r="610" fill="none" stroke="#d9b85f" stroke-width="16" opacity="0.42"/>
  <circle cx="800" cy="800" r="700" fill="none" stroke="#fff8ea" stroke-width="5" opacity="0.36"/>
</svg>
